name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ffi
          ini-values: ffi.enable=1, zend.assertions=1, opcache.jit=off
          coverage: none

      - name: Validate composer manifest
        run: composer validate --strict --no-check-lock

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Unit and lifecycle tests
        run: vendor/bin/phpunit

  soak:
    name: Flat-memory soak (5k request cycles, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ffi
          ini-values: ffi.enable=1, opcache.jit=off
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Soak
        run: php -d ffi.enable=1 tools/soak.php 5000

  soak-drop:
    name: Reclaiming soak (5k persist/drop cycles, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ffi
          ini-values: ffi.enable=1, opcache.jit=off
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Dropped graphs give their memory back
        run: php -d ffi.enable=1 tools/soak-drop.php 5000

  request-boundary:
    name: True multi-request gate (php-cgi/FastCGI, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ffi
          ini-values: ffi.enable=1, opcache.jit=off
          coverage: none

      - name: Install FastCGI client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfcgi-bin

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Objects survive real RINIT/RSHUTDOWN boundaries
        run: bash tools/request-boundary/run.sh 100

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ffi
          ini-values: ffi.enable=1, zend.assertions=1, opcache.enable=0, opcache.enable_cli=0, opcache.jit=off
          coverage: none

      - name: Validate composer manifest
        run: composer validate --strict --no-check-lock

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Unit and lifecycle tests
        run: vendor/bin/phpunit

  tests-opcache:
    name: Tests under opcache (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ffi, opcache
          # JIT stays off: it rewrites the executor internals z-engine hooks into
          ini-values: ffi.enable=1, zend.assertions=1, opcache.enable=1, opcache.enable_cli=1, opcache.jit=off, opcache.jit_buffer_size=0
          coverage: none

      - name: Assert opcache is active in the CLI SAPI
        run: php -r 'exit((int) !(function_exists("opcache_get_status") && opcache_get_status(false) !== false && ini_get("opcache.enable_cli")));'

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Unit and lifecycle tests under opcache
        run: vendor/bin/phpunit

  soak:
    name: Flat-memory soak (5k request cycles, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ffi
          ini-values: ffi.enable=1, opcache.enable=0, opcache.enable_cli=0, opcache.jit=off
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Soak
        run: php -d ffi.enable=1 tools/soak.php 5000

  soak-drop:
    name: Reclaiming soak (5k persist/drop cycles, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ffi
          ini-values: ffi.enable=1, opcache.enable=0, opcache.enable_cli=0, opcache.jit=off
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Dropped graphs give their memory back
        run: php -d ffi.enable=1 tools/soak-drop.php 5000

  request-boundary:
    name: True multi-request gate (php-cgi/FastCGI, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ffi
          # opcache.enable=0 pins the posture: the CGI SAPI defaults it to On, so
          # without the pin this gate silently runs under opcache on runners that
          # ship the extension enabled
          ini-values: ffi.enable=1, opcache.enable=0, opcache.enable_cli=0, opcache.jit=off
          coverage: none

      - name: Install FastCGI client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfcgi-bin

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Objects survive real RINIT/RSHUTDOWN boundaries
        run: bash tools/request-boundary/run.sh 100

# The multi-request gate can also be driven under opcache - locally only, not as a
# CI job. The CGI SAPI defaults opcache.enable to On, so any php-cgi whose ini does
# not pin it off (as the job above does) caches the gate script in opcache SHM,
# where its compile-time literals become IS_STR_PERMANENT strings that the persister
# keeps by pointer instead of copying:
#
#   bash tools/request-boundary/run.sh 100
#
# with Zend OPcache loaded and opcache.enable=1 (keep opcache.jit=off and
# opcache.jit_buffer_size=0 - the JIT rewrites the executor internals z-engine
# hooks into).
